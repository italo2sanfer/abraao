services:
  db_mysql:
    image: mysql:8.0
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT}:${MYSQL_PORT}"
    restart: always
  web:
    build:
      context: .
      args:
        SYSTEM_USER: ${SYSTEM_USER}
    command: "python manage.py runserver 0.0.0.0:${APP_PORT}"
    restart: always
    volumes:
      - '.:/home/${SYSTEM_USER}/abraao'
      - '/home/${LOCAL_USER}/.ssh:/home/${SYSTEM_USER}/.ssh'
    env_file:
      - .env
    depends_on:
      - db_mysql
    ports:
      - '${APP_PORT}:${APP_PORT}'
    stdin_open: true
    tty: true
