[project]
name = "abraao"
version = "0.1.0"
description = ""
authors = [
    {name = "Italo dos Santos Ferreira",email = "italo2sanfer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython (==8.18.1)",
    "django (==4.2)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-recaptcha (>=4.1.0,<5.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "cryptography (>=46.0.6,<47.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipdb (>=0.13.13,<0.14.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # se quiser ignorar linhas longas

[tool.poetry.scripts]
manage = "django.core.management:execute_from_command_line"
